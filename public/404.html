<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MUSLIM SHOP</title>
    <script>
      (function() {
        var path = location.pathname;
        var parts = path.split('/').filter(Boolean);
        var known = ['catalog', 'category', 'product', 'cart', 'checkout', 'order', 'namaz', 'about', 'contacts', 'admin'];
        var base = (parts.length && known.indexOf(parts[0].toLowerCase()) < 0) ? '/' + parts[0] : '';
        var subpath = base ? path.slice(base.length) : path;
        var query = location.search ? location.search.replace(/^\?/, '&') : '';
        location.replace(location.origin + base + '/?p=' + encodeURIComponent(subpath) + query + location.hash);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
